# ╭──────────────────────────────────────╮
# │              FONT                    │
# ╰──────────────────────────────────────╯

font_family JetBrainsMono Nerd Font
font_size 12.0

# ╭──────────────────────────────────────╮
# │              CURSOR                  │
# ╰──────────────────────────────────────╯

cursor_shape beam
cursor_blink_interval 0

# ╭──────────────────────────────────────╮
# │              WINDOW                  │
# ╰──────────────────────────────────────╯

background_opacity 0.80

window_padding_width 14
window_padding_height 12

hide_window_decorations yes
confirm_os_window_close 0

# ╭──────────────────────────────────────╮
# │              BEHAVIOUR               │
# ╰──────────────────────────────────────╯

enable_audio_bell no
scrollback_lines 10000

copy_on_select no
strip_trailing_spaces smart

# ╭──────────────────────────────────────╮
# │              URLS                    │
# ╰──────────────────────────────────────╯

url_color #88C0D0
url_style curly

# ╭──────────────────────────────────────╮
# │              SELECTION               │
# ╰──────────────────────────────────────╯

selection_foreground #111318
selection_background #88C0D0

# ╭──────────────────────────────────────╮
# │              COLORS                  │
# ╰──────────────────────────────────────╯

foreground #D8DEE9
background #111318
cursor #D8DEE9

color0  #191B21
color8  #4C566A

color1  #BF616A
color9  #BF616A

color2  #A3BE8C
color10 #A3BE8C

color3  #EBCB8B
color11 #EBCB8B

color4  #81A1C1
color12 #81A1C1

color5  #B48EAD
color13 #B48EAD

color6  #88C0D0
color14 #8FBCBB

color7  #D8DEE9
color15 #ECEFF4

# ╭──────────────────────────────────────╮
# │              KEYBINDS                │
# ╰──────────────────────────────────────╯

# New tab
map ctrl+shift+t new_tab

# Close current tab
map ctrl+shift+w close_tab

# Next / previous tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

# New window
map ctrl+shift+enter new_window

# Font size
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Clear screen + scrollback
map ctrl+shift+l clear_terminal reset active

# ╭──────────────────────────────────────╮
# │              SPLITS                  │
# ╰──────────────────────────────────────╯

# Create side-by-side split
map ctrl+v launch --location=vsplit

# Create top/bottom split
map ctrl+h launch --location=hsplit

# Navigate between panes
map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window up
map ctrl+down neighboring_window down

# Move panes
map ctrl+shift+left move_window left
map ctrl+shift+right move_window right
map ctrl+shift+up move_window up
map ctrl+shift+down move_window down

# Equalize pane sizes
map ctrl+shift+e layout_action equalize
enabled_layouts splits

# ==============================
# PANE BORDERS
# ==============================

# Make the active pane easy to identify
active_border_color #88C0D0
inactive_border_color #3B4252

# Thin, clean borders
window_border_width 1.5pt
draw_minimal_borders yes

# Slightly fade text in inactive panes
inactive_text_alpha 1.0

